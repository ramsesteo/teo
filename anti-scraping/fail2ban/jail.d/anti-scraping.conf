# /etc/fail2ban/jail.d/anti-scraping.conf
# Cloudflare arkasindaysaniz banaction olarak cloudflare kullanin (apikey/email gerekir),
# aksi halde varsayilan iptables/nftables yeterlidir.

[nginx-honeypot]
enabled  = true
port     = http,https
filter   = nginx-honeypot
logpath  = /var/log/nginx/honeypot.log
maxretry = 1
findtime = 1d
bantime  = 30d

[nginx-ratelimit]
enabled  = true
port     = http,https
filter   = nginx-ratelimit
logpath  = /var/log/nginx/error.log
maxretry = 30
findtime = 10m
bantime  = 6h

[nginx-badbot]
enabled  = true
port     = http,https
filter   = nginx-badbot
logpath  = /var/log/nginx/access.log
maxretry = 5
findtime = 10m
bantime  = 24h
