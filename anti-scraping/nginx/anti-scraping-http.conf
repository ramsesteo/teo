# anti-scraping-http.conf
# nginx.conf icindeki http { } blogunun icine ekleyin:
#   include /etc/nginx/anti-scraping-http.conf;

# --- 1) Gercek ziyaretci IP'si (Cloudflare arkasindaysaniz) ---
# Cloudflare IP listesi: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- 2) Hiz siniri: IP basina saniyede 10 istek, kisa patlamalara 20 tolerans ---
# Statik dosyalar (css/js/img) ayri ve daha genis bir bolgede sayilir.
limit_req_zone $binary_remote_addr zone=scrape_page:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=scrape_static:10m rate=50r/s;
limit_req_status 429;
limit_req_log_level warn;

# IP basina es zamanli baglanti siniri
limit_conn_zone $binary_remote_addr zone=scrape_conn:10m;
limit_conn_status 429;

# --- 3) Bilinen kazima araclari / kutuphaneleri (User-Agent) ---
# $bad_bot = 1 ise istek 403 ile reddedilir.
map $http_user_agent $bad_bot {
    default 0;
    ""                                  1;   # bos User-Agent
    ~*python-requests                   1;
    ~*python-urllib                     1;
    ~*aiohttp                           1;
    ~*scrapy                            1;
    ~*go-http-client                    1;
    ~*java/                             1;
    ~*libwww-perl                       1;
    ~*httpclient                        1;
    ~*okhttp                            1;
    ~*node-fetch                        1;
    ~*axios                             1;
    ~*curl/                             1;
    ~*wget/                             1;
    ~*HeadlessChrome                    1;
    ~*PhantomJS                         1;
    ~*Selenium                          1;
    ~*HTTrack                           1;
    ~*WebCopier                         1;
    ~*WebZIP                            1;
    ~*Teleport                          1;
    ~*Offline\ Explorer                 1;
    ~*SiteSucker                        1;
    ~*DataForSeoBot                     1;
    ~*AhrefsBot                         1;
    ~*SemrushBot                        1;
    ~*MJ12bot                           1;
    ~*DotBot                            1;
    ~*PetalBot                          1;
    ~*GPTBot                            1;
    ~*ClaudeBot                         1;
    ~*CCBot                             1;
    ~*Bytespider                        1;
    ~*Amazonbot                         1;
    ~*anthropic-ai                      1;
    ~*Google-Extended                   1;
}

# --- 4) Sadece Cloudflare uzerinden gelen trafik (dogrudan IP erisimini kapatmak icin) ---
# Cloudflare kullaniyorsaniz server {} icinde "if ($cf_only_block) { return 444; }" kullanin.
geo $realip_remote_addr $not_cloudflare {
    default 1;
    173.245.48.0/20 0; 103.21.244.0/22 0; 103.22.200.0/22 0; 103.31.4.0/22 0;
    141.101.64.0/18 0; 108.162.192.0/18 0; 190.93.240.0/20 0; 188.114.96.0/20 0;
    197.234.240.0/22 0; 198.41.128.0/17 0; 162.158.0.0/15 0; 104.16.0.0/13 0;
    104.24.0.0/14 0; 172.64.0.0/13 0; 131.0.72.0/22 0;
    2400:cb00::/32 0; 2606:4700::/32 0; 2803:f800::/32 0; 2405:b500::/32 0;
    2405:8100::/32 0; 2a06:98c0::/29 0; 2c0f:f248::/32 0;
    127.0.0.1 0; ::1 0;   # yerel saglik kontrolleri
}
