# example-site.conf  -> /etc/nginx/sites-available/example.com
server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/example.com;

    include /etc/nginx/anti-scraping-server.conf;

    # Sayfa istekleri: 10 istek/sn, 20'lik patlamaya izin; fazlasi 429
    location / {
        limit_req zone=scrape_page burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
