# anti-scraping-server.conf
# Her site icin server { } blogunun icine ekleyin:
#   include /etc/nginx/anti-scraping-server.conf;
# Not: Cloudflare KULLANMIYORSANIZ asagidaki "Cloudflare disi erisim" blogunu silin.

# Cloudflare disindan dogrudan sunucu IP'sine gelen istekleri sessizce kes (444 = baglantiyi kapat)
if ($not_cloudflare) { return 444; }

# Bilinen kazima araclarini reddet
if ($bad_bot) { return 403; }

# Es zamanli baglanti siniri
limit_conn scrape_conn 20;

# Honeypot: insanlarin gormedigi gizli link. Buraya gelen kesinlikle bottur.
# Fail2ban "nginx-honeypot" filtresi bu satiri yakalayip IP'yi yasaklar.
location = /.well-known/private-feed.json {
    access_log /var/log/nginx/honeypot.log combined;
    add_header Cache-Control "no-store" always;
    return 403;
}

# robots.txt'i her zaman sun
location = /robots.txt {
    root /var/www/anti-scraping;
    limit_req zone=scrape_static burst=20 nodelay;
}

# Statik dosyalar: genis limit
location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|map)$ {
    limit_req zone=scrape_static burst=100 nodelay;
    try_files $uri =404;
}
